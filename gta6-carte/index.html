<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0d1030; }

    </style>

      <div id="map" data-composition-id="map" data-composition-src="compositions/map.html" data-start="0" data-duration="42.6" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
