  <script>
    // Local times; film start 10.7 = the music drop. Beats every 0.6 s.
    const tl = gsap.timeline({ paused: true });
    const WHIP = 2.4;

    // --- street: the word slams in behind her on the drop
    tl.fromTo("#l-a-word", { scale: 1.55, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "expo.out" }, 0.04);
    // three-frame impact shake on the camera
    tl.fromTo("#l-a-cam", { x: 0, y: 0 }, { x: 14, y: -8, duration: 0.033, ease: "none" }, 0.2);
    tl.to("#l-a-cam", { x: -10, y: 6, duration: 0.033, ease: "none" }, 0.233);

    tl.to("#l-a-cam", { x: 0, y: 0, duration: 0.033, ease: "none" }, 0.3);
    // punch-ins on the beat
    tl.fromTo("#l-a-cam", { scale: 1 }, { scale: 1.07, duration: 0.14, ease: "power3.out" }, 1.2);
    tl.to("#l-a-cam", { scale: 1.14, duration: 0.14, ease: "power3.out" }, 1.8);
    // whip out to the left, accelerating into the cut
    tl.to("#l-a-cam", { x: -1080, duration: 0.24, ease: "power3.in" }, WHIP - 0.24);

    // --- underpass: whips in from the right, the word stutters on the beats

    tl.fromTo("#l-b-w2", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.22, ease: "expo.out" }, WHIP + 0.06);
    tl.fromTo("#l-b-w1", { opacity: 0 }, { opacity: 0.85, duration: 0.05, ease: "none" }, WHIP + 0.6);
    tl.fromTo("#l-b-w3", { opacity: 0 }, { opacity: 0.85, duration: 0.05, ease: "none" }, WHIP + 1.2);
    tl.fromTo("#l-b-cam", { scale: 1 }, { scale: 1.06, duration: 0.14, ease: "power3.out" }, WHIP + 1.8);
    window.__timelines["loud"] = tl;
