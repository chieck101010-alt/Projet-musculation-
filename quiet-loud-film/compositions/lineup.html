  <script>
    // Local times; film start 20.3. Beats every 0.6 s.
    const tl = gsap.timeline({ paused: true });
    const looks = ["#u-l1", "#u-l2", "#u-l3", "#u-l4"];
    const S = 2.4;
    looks.forEach((sel, i) => {
      const t = i * 0.6;
      const off = i < 3 ? t + 0.6 : S + 0.5;
      tl.set(sel, { visibility: "visible" }, t);
      tl.set(sel, { visibility: "hidden" }, off);
      // each look lands slightly large and settles, like a flash catching it
      tl.fromTo(`${sel} .u-full`, { scale: 1.07 }, { scale: 1.0, duration: 0.5, ease: "power3.out" }, t);
      tl.fromTo(`${sel} .u-mark`, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out" }, t + 0.03);
    });
    // strips arrive from alternate ends on the next bar
    const strips = ["#u-s1", "#u-s2", "#u-s3", "#u-s4"];
    strips.forEach((sel, i) => {
      const from = i % 2 === 0 ? -1920 : 1920;
      tl.fromTo(sel, { y: from }, { y: 0, duration: 0.5, ease: "power3.out" }, S + i * 0.08);
      tl.fromTo(`${sel} .u-n`, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, S + 0.45 + i * 0.08);
    });
    // and leave the same way, revealing the end card underneath
    const OUT = 4.8;
    strips.forEach((sel, i) => {
      const to = i % 2 === 0 ? 1920 : -1920;
      tl.to(sel, { y: to, duration: 0.42, ease: "power3.in" }, OUT + i * 0.05);
    });
    window.__timelines["lineup"] = tl;
  </script>
