<template>
  <style>
    @font-face {
      font-family: "Instrument Serif";
      font-style: italic;
      font-weight: 400;
      src: url("assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2");
    }
    @font-face {
      font-family: "Anton";
      font-style: normal;
      font-weight: 400;
      src: url("assets/fonts/anton-latin-400-normal.woff2") format("woff2");
    }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #f2f0eb;
    }
    #e-block {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
    }
    #e-quiet {
      position: absolute;
      left: 132px;
      top: 340px;
      font-family: "Instrument Serif", serif;
      font-style: italic;
      font-size: 270px;
      line-height: 1;
      letter-spacing: -0.02em;
      color: #0d0e11;
    }
    #e-slash {
      position: absolute;
      left: 760px;
      top: 372px;
      width: 12px;
      height: 230px;
      background: #1462ff;
      transform: rotate(22deg);
      transform-origin: 50% 0%;
    }
    #e-loud {
      position: absolute;
      left: 140px;
      top: 622px;
      font-family: "Anton", sans-serif;
      font-size: 280px;
      line-height: 1;
      letter-spacing: 0.01em;
      color: #0d0e11;
    }
    #e-rule {
      position: absolute;
      left: 146px;
      top: 940px;
      width: 120px;
      height: 3px;
      background: #0d0e11;
      transform-origin: 0 50%;
    }
    #e-tag {
      position: absolute;
      left: 140px;
      width: 640px;
      top: 978px;
      text-wrap: balance;
      font-family: "Instrument Serif", serif;
      font-style: italic;
      font-size: 68px;
      line-height: 1.08;
      color: #0d0e11;
    }
    #e-tag span {
      display: inline-block;
      margin-right: 0.22em;

  </style>
  <div
    id="root"
    data-composition-id="endcard"
    data-width="1080"
    data-height="1920"
    data-composition-variables='[{"id":"tagline","type":"string","label":"Signature","default":"Ton style parle en premier."}]'
  >
    <div id="e-block">
      <div id="e-quiet">Quiet</div>
      <div id="e-slash"></div>
      <div id="e-loud">LOUD</div>
      <div id="e-rule"></div>
      <div id="e-tag">Ton style parle en premier.</div>
    </div>
  </div>
  <script>
    // Local times; film start 25.1. "Quiet" spoken at film 25.31, "Loud" at 26.3, tagline from 27.5.
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#e-quiet", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", clearProps: "filter", duration: 0.22, ease: "power4.out" }, 0.2);
    tl.fromTo("#e-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.out" }, 2.2);
    tl.fromTo("#e-slash", { scaleY: 0, rotation: 22 }, { scaleY: 1, rotation: 22, duration: 0.32, ease: "expo.out" }, 0.82);
    tl.fromTo("#e-loud", { opacity: 0, scale: 1.45 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 1.18);
    // impact shake on the whole block as LOUD lands
    tl.fromTo("#e-block", { x: 0, y: 0 }, { x: 10, y: -6, duration: 0.033, ease: "none" }, 1.36);
    tl.to("#e-block", { x: -7, y: 4, duration: 0.033, ease: "none" }, 1.393);
    tl.to("#e-block", { x: 3, y: -2, duration: 0.033, ease: "none" }, 1.426);
    tl.to("#e-block", { x: 0, y: 0, duration: 0.033, ease: "none" }, 1.46);

    // tagline: split into words at build time, each turns from grey to ink as it is said
    const tag = document.querySelector("#e-tag");
    const vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
    const text = vars.tagline ? String(vars.tagline) : tag.textContent;
    const words = text.trim().split(/\s+/);
    tag.innerHTML = words.map((w) => `<span>${w}</span>`).join("");
    const spans = tag.querySelectorAll("span");
    const span = 1.15; // spoken length of the tagline, roughly
    spans.forEach((el, i) => {
      const t = 2.4 + (i * span) / spans.length;
      tl.fromTo(el, { opacity: 0, color: "#b8b5ad" }, { opacity: 1, color: "#b8b5ad", duration: 0.12, ease: "power2.out" }, 2.3 + i * 0.04);
      tl.to(el, { color: "#0d0e11", duration: 0.1, ease: "power2.out" }, t);
    });
    window.__timelines["endcard"] = tl;
  </script>
