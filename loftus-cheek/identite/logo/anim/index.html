<!doctype html>
<!--
  LOFTUS-CHEEK — animation officielle du logo (version finale 5 s, 9:16).
  Monogramme LC : contours vectorisés depuis le logo officiel (assets/logo/lc-contours.json),
  face avant texturée avec le logo officiel (assets/logo/lc-face.png), tranches en chrome.
  Textes : découpés tels quels du logo officiel (wordmark.png, signature.png).
  Chaque image = render(t), pilotée par une horloge GSAP linéaire (seek-safe).
-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --ground: #050505; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: absolute; inset: 0; overflow: hidden; background: var(--ground); }
      #lc-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; }
      #lc-words { position: absolute; left: 0; right: 0; top: 1205px; height: 260px; }
      #lc-wordmark-wrap { position: absolute; left: 50%; top: 0; width: 940px; height: 88px; margin-left: -470px; overflow: hidden; }
      #lc-wordmark { position: absolute; left: 0; top: 0; width: 940px; height: 88px; background: url(assets/logo/wordmark.png) center / 100% 100% no-repeat; }
      #lc-shine { position: absolute; top: 0; left: 0; width: 940px; height: 88px;
        -webkit-mask: url(assets/logo/wordmark.png) center / 100% 100% no-repeat; mask: url(assets/logo/wordmark.png) center / 100% 100% no-repeat; }
      #lc-shine-band { position: absolute; top: -20px; left: 0; width: 220px; height: 128px;
        background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,250,240,0.95) 50%, rgba(255,255,255,0) 100%); }
      #lc-signature { position: absolute; left: 50%; top: 122px; width: 920px; height: 63px; margin-left: -460px;
        background: url(assets/logo/signature.png) center / 100% 100% no-repeat; }
      #lc-vignette { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 70% 55% at 50% 42%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.75) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <canvas id="lc-canvas" width="1080" height="1920" data-layout-allow-overflow></canvas>
      <div id="lc-words">
        <div id="lc-wordmark-wrap">
          <div id="lc-wordmark"></div>
          <div id="lc-shine"><div id="lc-shine-band"></div></div>
        </div>
        <div id="lc-signature"></div>
      </div>
      <div id="lc-vignette"></div>
    </div>

    <script>
      (function () {
        var root = document.getElementById("root");
        var duration = parseFloat(root.dataset.duration) || 5;
        var clock = { t: 0 };
        var host = { clock: clock, duration: duration, render: null };
        window.__lc = host;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["lc"] = new Promise(function (resolve) { host.ready = resolve; });
        var tl = gsap.timeline({ paused: true });
        tl.to(clock, { t: duration, duration: duration, ease: "none",
          onUpdate: function () { if (host.render) host.render(clock.t); } }, 0);
        // Nom : révélation par masque (de gauche à droite) + montée légère
        tl.fromTo("#lc-wordmark-wrap", { clipPath: "inset(0 100% 0 0)", y: 18, opacity: 0.0 },
          { clipPath: "inset(0 0% 0 0)", y: 0, opacity: 1, duration: 0.9, ease: "power3.out" }, 2.25);
        // Reflet qui court sur les lettres
        tl.fromTo("#lc-shine-band", { x: -260 }, { x: 1000, duration: 1.1, ease: "power2.inOut" }, 2.95);
        // Signature
        tl.fromTo("#lc-signature", { opacity: 0, scaleX: 0.92 },
          { opacity: 1, scaleX: 1, duration: 0.8, ease: "power2.out" }, 3.05);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>

    <script type="module">
      import * as THREE from "./assets/lib/three.module.min.js";

      const host = window.__lc;
      const W = 1080, H = 1920, DEG = Math.PI / 180;
      const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
      const lerp = (a, b, x) => a + (b - a) * x;
      const seg = (t, a, b) => clamp01((t - a) / (b - a));
      const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
      const inOut3 = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

      const canvas = document.getElementById("lc-canvas");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050505);
      const camera = new THREE.PerspectiveCamera(24, W / H, 0.1, 100);

      // Studio virtuel : bandes lumineuses froides + une touche champagne
      let envScene, pmrem, envGroup;
      function buildEnv(angle) {
        const pm = pmrem || (pmrem = new THREE.PMREMGenerator(renderer));
        const tex = pm.fromScene(envScene, 0.02).texture;
        return tex;
      }
      function makeEnvScene() {
        envScene = new THREE.Scene();
        envScene.background = new THREE.Color(0x020202);
        envGroup = new THREE.Group(); envScene.add(envGroup);
        const strip = (w, h, x, y, z, ry, c, k) => {
          const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
            new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), side: THREE.DoubleSide }));
          m.position.set(x, y, z); m.rotation.y = ry; envGroup.add(m);
        };
        strip(1.6, 10, -4.5, 0, 2.0, Math.PI / 2.3, 0xf2f4ff, 4.0);  // clé froide gauche
        strip(0.9, 10, 4.5, 0, 1.0, -Math.PI / 2.2, 0xffffff, 2.6);  // contre droite
        strip(10, 0.8, 0, 4.8, 0, 0, 0xffffff, 1.2);                 // plafond
        strip(1.2, 6, 0, -1, -5, 0, 0xd8c3a0, 1.6);                  // touche champagne derrière
        strip(10, 0.5, 0, -4.5, 1, 0, 0x8a8a90, 0.6);                // sol
      }

      // Contours vectorisés du logo officiel → THREE.Shape
      function buildShapes(data, S, cx, cy) {
        const X = (x) => (x - cx) / S, Y = (y) => -(y - cy) / S;
        const paths = data.curves.map((cmds) => {
          const p = new THREE.Path();
          for (const c of cmds) {
            if (c[0] === "M") p.moveTo(X(c[1]), Y(c[2]));
            else if (c[0] === "L") p.lineTo(X(c[1]), Y(c[2]));
            else p.bezierCurveTo(X(c[1]), Y(c[2]), X(c[3]), Y(c[4]), X(c[5]), Y(c[6]));
          }
          return p;
        });
        // le plus grand contour = forme extérieure, les autres = trous
        const area = (p) => Math.abs(THREE.ShapeUtils.area(p.getPoints(8)));
        paths.sort((a, b) => area(b) - area(a));
        const shape = new THREE.Shape(paths[0].getPoints(24));
        for (let i = 1; i < paths.length; i++) shape.holes.push(new THREE.Path(paths[i].getPoints(24)));
        return [shape];
      }

      let logo, flare, flareMat;
      async function build() {
        makeEnvScene();
        scene.environment = buildEnv(0);
        scene.environmentIntensity = 1.0;

        const data = await (await fetch("assets/logo/lc-contours.json")).json();
        const S = 100, cx = 315, cy = 267;           // 1 unité = 100 px du logo source
        const shapes = buildShapes(data, S, cx, cy);
        const geo = new THREE.ExtrudeGeometry(shapes, {
          depth: 0.42, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.035,
          bevelOffset: -0.035, bevelSegments: 4, curveSegments: 24,
        });
        geo.translate(0, 0, -0.21);
        geo.computeVertexNormals();

        const faceTex = await new THREE.TextureLoader().loadAsync("assets/logo/lc-face.png");
        faceTex.colorSpace = THREE.SRGBColorSpace; faceTex.anisotropy = 8;
        faceTex.repeat.set(S / data.w, S / data.h);
        faceTex.offset.set(cx / data.w, 1 - cy / data.h);
        faceTex.wrapS = faceTex.wrapT = THREE.ClampToEdgeWrapping;

        // face avant : le logo officiel, en métal (garde ses dégradés, réagit aux reflets)
        const faceMat = new THREE.MeshPhysicalMaterial({ map: faceTex, color: 0x2a2a2c, metalness: 0.0, roughness: 0.45,
          emissive: 0xffffff, emissiveMap: faceTex, emissiveIntensity: 0.0,
          clearcoat: 1, clearcoatRoughness: 0.04, envMapIntensity: 1.0 });
        host.faceMat = faceMat;
        // tranches et biseaux : chrome
        const sideMat = new THREE.MeshPhysicalMaterial({ color: 0xd9dadf, metalness: 1, roughness: 0.16, envMapIntensity: 1.3 });
        logo = new THREE.Mesh(geo, [faceMat, sideMat]);
        scene.add(logo);

        // petit éclat lumineux (sprite) qui passe sur le biseau à l'arrêt
        const fc = document.createElement("canvas"); fc.width = fc.height = 256;
        const g = fc.getContext("2d");
        const rg = g.createRadialGradient(128, 128, 0, 128, 128, 128);
        rg.addColorStop(0, "rgba(255,248,235,1)"); rg.addColorStop(0.12, "rgba(255,236,210,0.55)"); rg.addColorStop(1, "rgba(255,230,200,0)");
        g.fillStyle = rg; g.fillRect(0, 0, 256, 256);
        g.globalCompositeOperation = "lighter";
        const lg = g.createLinearGradient(0, 0, 256, 0); lg.addColorStop(0, "rgba(255,245,230,0)"); lg.addColorStop(0.5, "rgba(255,245,230,0.9)"); lg.addColorStop(1, "rgba(255,245,230,0)");
        g.fillStyle = lg; g.fillRect(0, 127, 256, 2);
        flareMat = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(fc), transparent: true, depthTest: false, blending: THREE.AdditiveBlending });
        flare = new THREE.Sprite(flareMat); flare.scale.set(1.6, 1.6, 1); scene.add(flare);

        await renderer.compileAsync(scene, camera);
      }

      function render(t) {
        // 0,2 → 2,2 s : le LC sort de l'ombre en pivotant (-62° → 0°), arrêt net, micro-respiration ensuite
        const a = outExpo(seg(t, 0.2, 2.2));
        logo.rotation.y = lerp(-62, 0, a) * DEG + 2.5 * DEG * Math.sin(t * 0.9) * seg(t, 2.2, 3.2);
        logo.rotation.x = lerp(14, 0, a) * DEG;
        logo.position.y = 1.64 + lerp(-0.35, 0, a);
        const s = lerp(0.92, 1, a);
        logo.scale.set(s, s, s);

        // l'environnement tourne : les reflets balaient le métal
        envGroup.rotation.y = lerp(-1.1, 0.9, inOut3(seg(t, 0, 5)));
        scene.environment.dispose();
        scene.environment = buildEnv();
        scene.environmentIntensity = lerp(0.0, 1.0, inOut3(seg(t, 0.1, 1.4)));

        // caméra : léger travelling avant
        const k = inOut3(seg(t, 0, 5));
        const dist = lerp(40, 37, k);
        camera.position.set(0, 0, dist);
        camera.lookAt(0, 0, 0);
        // le logo officiel « s'allume » à mesure qu'il tourne vers nous
        host.faceMat.emissiveIntensity = 0.95 * inOut3(seg(t, 0.5, 2.2));
        camera.updateProjectionMatrix();

        // éclat sur le haut du L au moment de l'arrêt (2,15 → 2,9 s)
        const f = seg(t, 2.1, 2.9);
        flareMat.opacity = Math.sin(Math.PI * f);
        flare.position.set(lerp(-2.4, -0.6, f), 1.64 + 2.45, 0.4);
        flare.scale.setScalar(1.6 + 0.9 * Math.sin(Math.PI * f));

        renderer.render(scene, camera);
      }

      await build();
      host.render = render;
      render(host.clock.t);
      host.ready();
      window.addEventListener("hf-seek", (e) => render(e.detail.time));
    </script>
  </body>
</html>
