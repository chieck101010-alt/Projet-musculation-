<!doctype html>
<!--
  LOFTUS-CHEEK · V2 · TEST TECHNIQUE 3D (gratuit)
  Vrais modèles 3D PBR (CC-BY 4.0) : sneaker « MaterialsVariantsShoe » (Shopify) et « ChronographWatch » (DGG, d'après graphiccompressor).
  Reflets : HDRI (three.js examples). Rendu raster WebGL, ombres douces, travelling caméra.
  0–3 s : orbite basse autour de la sneaker · 3–6 s : gros plan cadran de la montre.
-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script type="importmap">{ "imports": { "three": "./assets/lib/three.module.min.js" } }</script>
    <style>
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #050505; }
      #t3d-root { position: absolute; inset: 0; overflow: hidden; background: #050505; }
      #t3d-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; }
      #t3d-vig { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.75) 100%); }
    </style>
  </head>
  <body>
    <div id="t3d-root" data-composition-id="test3d" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <canvas id="t3d-canvas" width="1080" height="1920" data-layout-allow-overflow></canvas>
      <div id="t3d-vig"></div>
    </div>
    <script>
      (function () {
        var clock = { t: 0 }, host = { clock: clock, render: null };
        window.__t3d = host;
        window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["test3d"] = new Promise(function (r) { host.ready = r; });
        var tl = gsap.timeline({ paused: true });
        tl.to(clock, { t: 6, duration: 6, ease: "none", onUpdate: function () { if (host.render) host.render(clock.t); } }, 0);
        window.__timelines = window.__timelines || {}; window.__timelines["test3d"] = tl;
      })();
    </script>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "./assets/lib/jsm/loaders/GLTFLoader.js";
      import { RGBELoader } from "./assets/lib/jsm/loaders/RGBELoader.js";

      const host = window.__t3d, W = 1080, H = 1920, DEG = Math.PI / 180;
      const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x), lerp = (a, b, x) => a + (b - a) * x;
      const seg = (t, a, b) => clamp01((t - a) / (b - a));
      const io = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("t3d-canvas"), antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1); renderer.setSize(W, H, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
      renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene(); scene.background = new THREE.Color(0x050505);
      const camera = new THREE.PerspectiveCamera(28, W / H, 0.01, 100);
      let shoe, watch, key, rim;

      function normalize(obj, size) {
        const box = new THREE.Box3().setFromObject(obj), s = new THREE.Vector3(), c = new THREE.Vector3();
        box.getSize(s); box.getCenter(c);
        const k = size / Math.max(s.x, s.y, s.z);
        obj.scale.setScalar(k); obj.position.sub(c.multiplyScalar(k));
        const b2 = new THREE.Box3().setFromObject(obj); obj.position.y -= b2.min.y;
        obj.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
      }

      async function build() {
        const hdr = await new RGBELoader().loadAsync("assets/3d/studio.hdr");
        hdr.mapping = THREE.EquirectangularReflectionMapping;
        scene.environment = hdr; scene.environmentIntensity = 0.55;

        const loader = new GLTFLoader();
        const g1 = await loader.loadAsync("assets/3d/MaterialsVariantsShoe.glb");
        shoe = g1.scene; normalize(shoe, 1.0); scene.add(shoe);
        const g2 = await loader.loadAsync("assets/3d/ChronographWatch.glb");
        watch = g2.scene; normalize(watch, 1.0); watch.position.x += 6; scene.add(watch);

        // sol : ombre de contact + léger reflet sombre
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x0a0a0c, roughness: 0.35, metalness: 0.4 }));
        floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

        key = new THREE.SpotLight(0xffffff, 40, 20, 0.45, 0.7, 1.4);
        key.position.set(-2.5, 3.5, 2.5); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 8; key.shadow.bias = -0.0005;
        scene.add(key, key.target);
        rim = new THREE.SpotLight(0x6fa8ff, 30, 20, 0.5, 0.8, 1.4); rim.position.set(2.8, 2.2, -2.5); scene.add(rim, rim.target);
        await renderer.compileAsync(scene, camera);
      }

      function render(t) {
        if (t < 3) {
          // orbite basse autour de la sneaker + lumière qui monte progressivement
          const k = io(seg(t, 0, 3));
          const a = lerp(-55, 25, k) * DEG, d = lerp(2.6, 1.9, k);
          camera.position.set(Math.sin(a) * d, lerp(0.25, 0.42, k), Math.cos(a) * d);
          camera.lookAt(0, 0.22, 0);
          key.target.position.set(0, 0.2, 0); rim.target.position.set(0, 0.2, 0);
          key.intensity = lerp(8, 40, seg(t, 0, 1.2));
        } else {
          // gros plan cadran : la montre tourne doucement, caméra qui glisse
          const k = io(seg(t, 3, 6));
          watch.rotation.y = lerp(25, -10, k) * DEG;
          const c = new THREE.Vector3(6, 0.45, 0);
          camera.position.set(c.x + lerp(0.25, -0.1, k), c.y + 0.2, c.z + lerp(1.2, 0.95, k));
          camera.lookAt(c);
          key.position.set(4.2, 3.2, 2.5); key.target.position.copy(c); rim.position.set(8.5, 2, -2); rim.target.position.copy(c);
          key.intensity = 40;
        }
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
      }

      await build();
      host.render = render; render(host.clock.t); host.ready();
      window.addEventListener("hf-seek", (e) => render(e.detail.time));
    </script>
  </body>
</html>
