<!doctype html>
<html
  lang="fr"
  data-composition-variables='[
    {"id":"handle","type":"string","label":"Pseudo Snapchat","default":"@TON.SNAP","maxLength":16}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --snap-yellow: #fffc00;
        --ink: #0a0a0a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #grain {
        position: absolute;
        inset: -60px;
        z-index: 10;
        pointer-events: none;
        opacity: 0.09;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
      }
      #vignette {
        position: absolute;
        inset: 0;
        z-index: 9;
        pointer-events: none;
        background: radial-gradient(120% 80% at 50% 50%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="22.5"
      data-width="1080"
      data-height="1920"
    >
      <!-- scenes, cut on the bars of the 144 bpm track -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="3.333" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="models" data-composition-id="models" data-composition-src="compositions/models.html"
        data-start="3.333" data-duration="6.667" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="details" data-composition-id="details" data-composition-src="compositions/details.html"
        data-start="10" data-duration="3.333" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="urban" data-composition-id="urban" data-composition-src="compositions/urban.html"
        data-start="13.333" data-duration="3.334" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html"
        data-start="16.667" data-duration="5.833" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920"
        data-variable-values='{"handle":"@TON.SNAP"}'></div>

      <div id="vignette" class="clip" data-start="0" data-duration="22.5" data-track-index="1"></div>
      <div id="grain" class="clip" data-start="0" data-duration="22.5" data-track-index="2"></div>

      <!-- music: Lyria 3.5 (FLORA), entered on its first full bar -->
      <audio id="music" class="clip" src="assets/audio/music-cut.mp3" data-start="0" data-duration="22.5"
        data-track-index="3" data-volume="0.8" data-fade-out="1.4"></audio>

      <!-- sound on visible actions -->
      <audio id="sfx-hook" class="clip" src="assets/audio/sfx/impact-bass-1.mp3" data-start="0" data-duration="2.1" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-tag" class="clip" src="assets/audio/sfx/glitch-1.mp3" data-start="1.64" data-duration="0.6" data-track-index="5" data-volume="0.45" data-fade-out="0.2"></audio>
      <audio id="sfx-m1" class="clip" src="assets/audio/sfx/whoosh-short.mp3" data-start="3.31" data-duration="0.57" data-track-index="4" data-volume="0.55"></audio>
      <audio id="sfx-m2" class="clip" src="assets/audio/sfx/whoosh.mp3" data-start="4.98" data-duration="0.57" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-m3" class="clip" src="assets/audio/sfx/whoosh-short.mp3" data-start="6.64" data-duration="0.57" data-track-index="4" data-volume="0.55"></audio>
      <audio id="sfx-m4" class="clip" src="assets/audio/sfx/whoosh.mp3" data-start="8.31" data-duration="0.57" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-d1" class="clip" src="assets/audio/sfx/glitch-2.mp3" data-start="10" data-duration="0.5" data-track-index="4" data-volume="0.4" data-fade-out="0.15"></audio>
      <audio id="sfx-d2" class="clip" src="assets/audio/sfx/click-soft.mp3" data-start="11.05" data-duration="0.36" data-track-index="4" data-volume="0.6"></audio>
      <audio id="sfx-d3" class="clip" src="assets/audio/sfx/click-soft.mp3" data-start="12.1" data-duration="0.36" data-track-index="4" data-volume="0.6"></audio>
      <audio id="sfx-d4" class="clip" src="assets/audio/sfx/whoosh-short.mp3" data-start="12.7" data-duration="0.57" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-u1" class="clip" src="assets/audio/sfx/impact-bass-2.mp3" data-start="15" data-duration="1.6" data-track-index="6" data-volume="0.45" data-fade-out="0.5"></audio>
      <audio id="sfx-riser" class="clip" src="assets/audio/sfx/riser.mp3" data-start="14.6" data-media-start="1.4" data-duration="2.067" data-track-index="5" data-volume="0.35" data-fade-in="0.4"></audio>
      <audio id="sfx-cta" class="clip" src="assets/audio/sfx/impact-bass-1.mp3" data-start="16.667" data-duration="2.1" data-track-index="4" data-volume="0.55"></audio>
      <audio id="sfx-handle" class="clip" src="assets/audio/sfx/pop.mp3" data-start="17.76" data-duration="0.72" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-tap" class="clip" src="assets/audio/sfx/click-soft.mp3" data-start="19.67" data-duration="0.36" data-track-index="5" data-volume="0.7"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#grain", { x: 0, y: 0 }, { x: 60, y: -40, duration: 22.5, ease: "steps(270)" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
