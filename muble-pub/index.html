<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #4c14a6; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #s1, #s2, #s3, #s4, #s5, #s6 { z-index: 1; }
      #grain { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 8; opacity: 0.05; mix-blend-mode: overlay; pointer-events: none; }
      #captions { z-index: 9; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="72" data-width="1080" data-height="1920">
      <!-- MUBLE — « 2 minutes chrono » — version principale 72 s, 9:16 -->
      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1-hook.html" data-start="0" data-duration="7" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2-chauffeur.html" data-start="7" data-duration="4.5" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3-demo.html" data-start="11.5" data-duration="33.5" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4-avantages.html" data-start="45" data-duration="10" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s5" data-composition-id="s5" data-composition-src="compositions/s5-cibles.html" data-start="55" data-duration="9" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s6" data-composition-id="s6" data-composition-src="compositions/s6-cta.html" data-start="64" data-duration="8" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <img id="grain" class="clip" src="assets/textures/grain.png" data-start="0" data-duration="72" data-track-index="1" alt="" />
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="72" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
