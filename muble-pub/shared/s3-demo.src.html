  <script>
    (function () {
      // ---- Horloge de la scène (secondes locales). À recaler sur la voix off. ----
      const T = {
        reveal: 0.0, rise: 0.12, chronoIn: 1.25, dive: 4.6,
        s1: 5.1, tapDep: 6.9, tapArr: 8.5,
        s2: 10.05, tapDate: 11.55, tapTime: 12.1, tapPax: 12.75, tapBag: 14.5,
        s3: 15.75, tapBer: 18.95, back: 20.55,
        s4: 21.55, tapNom: 22.15, tapTel: 23.3, tapMail: 24.45,
        s5: 25.9, tapSend: 26.4, recede: 27.35, f1: 27.75, f2: 29.75, f3: 32.45, f4: 33.95,
        end: 35.75,
      };
      const CHRONO_STOP = 108; // 1:48 affiché à l'envoi (promesse du site : « réservé en 2 minutes »)
      const CHAR = 0.06;
      const ZOOM = 2.45, HERO = 1.4, FOCUS_Y = 790;
      const $ = (s) => document.querySelector(s);

      function build() {
        const tl = gsap.timeline({ paused: true });
        tl.to("#s3-driver", { opacity: 0, duration: T.end }, 0);

        // ---------- anneau du chrono : 5 segments ----------
        const C = 2 * Math.PI * 66, SEG = C / 5, GAP = 16;
        const segFill = (i, t0, dur) => {
          const c = $("#s3-segf" + i);
          const o = { v: 0 };
          tl.set(c, { opacity: 1 }, t0);
          tl.to(o, { v: 1, duration: dur, ease: "none", onUpdate: () => {
            const L = Math.max(0.01, (SEG - GAP) * o.v);
            c.setAttribute("stroke-dasharray", L + " " + (C - L));
          } }, t0);
        };
        const clock = { s: 0 };
        const fmt = () => { const s = Math.round(clock.s); $("#s3-time").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

        // ---------- géométrie du téléphone ----------
        const page = $("#s3-page");
        const off = (el) => { let x = 0, y = 0, e = el; while (e && e !== page) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; } return { x, y, w: el.offsetWidth, h: el.offsetHeight }; };
        const SCROLL = off($(".mb-formsec")).y + 4;
        const center = (el) => { const o = off(el); return { x: 20 + o.x + o.w / 2, y: 140 + o.y - SCROLL + o.h / 2 }; };
        const camTo = (el, s, at, dur, ease, dy) => {
          const c = center(el);
          tl.to("#s3-holder", { scale: s, x: 0, y: (FOCUS_Y + (dy || 0)) - 960 - s * (c.y - 442), rotationX: 0, rotationY: 0, rotationZ: 0, duration: dur, ease: ease || "power2.inOut" }, at);
        };
        const touchAt = (el, at) => {
          const c = center(el);
          tl.set("#s3-touch", { x: c.x - 20, y: c.y - 20 }, at - 0.18);
          tl.fromTo("#s3-touch", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power2.out" }, at - 0.18);
          tl.to("#s3-touch", { scale: 0.78, duration: 0.08, ease: "power4.in" }, at - 0.04);
          tl.to("#s3-touch", { scale: 1, duration: 0.12, ease: "power2.out" }, at + 0.06);
          tl.to("#s3-touch", { opacity: 0, duration: 0.18, ease: "power2.in" }, at + 0.22);
        };
        const focus = (el, at) => tl.to(el, { borderColor: "#6a2bc2", backgroundColor: "#ffffff", boxShadow: "0 0 0 4px rgba(106,43,194,0.14)", duration: 0.12 }, at);
        const blur = (el, at) => tl.to(el, { borderColor: "#e2e1e7", backgroundColor: "#f3f3f5", boxShadow: "0 0 0 0px rgba(106,43,194,0)", duration: 0.12 }, at);
        const typeIn = (sel, text, at) => {
          const f = $(sel), ph = f.querySelector(".mb-ph"), val = f.querySelector(".mb-val"), car = f.querySelector(".mb-caret");
          focus(f, at);
          tl.set(car, { opacity: 1 }, at);
          if (ph) tl.set(ph, { display: "none" }, at + 0.08);
          for (let i = 1; i <= text.length; i++) tl.set(val, { innerText: text.slice(0, i) }, at + 0.08 + i * CHAR);
          const done = at + 0.08 + text.length * CHAR;
          tl.set(car, { opacity: 0 }, done + 0.25); tl.set(car, { opacity: 1 }, done + 0.5); tl.set(car, { opacity: 0 }, done + 0.75);
          return done;
        };
        const pick = (sel, text, at) => { const f = $(sel), val = f.querySelector(".mb-val"), ph = f.querySelector(".mb-ph"); focus(f, at); if (ph) tl.set(ph, { display: "none" }, at + 0.1); tl.set(val, { innerText: text }, at + 0.12); tl.fromTo(val, { opacity: 0.2 }, { opacity: 1, duration: 0.15 }, at + 0.12); blur(f, at + 0.5); };
        const stepIn = (id, at, prev) => {
          if (prev) tl.to(prev, { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, at - 0.16);
          tl.fromTo(id, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, at);
        };

        // ---------- 0 : le plateau violet monte, le téléphone arrive ----------
        tl.fromTo("#s3-stage", { clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0% 0 0 0)", duration: 0.45, ease: "power2.inOut" }, T.reveal);
        tl.set("#s3-page", { y: 0 }, 0);
        tl.fromTo("#s3-holder", { y: 1500, scale: HERO, rotationX: 34, rotationY: -26, rotationZ: 4 }, { y: 190, rotationX: 9, rotationY: -14, rotationZ: 0, duration: 1.05, ease: "back.out(1.15)" }, T.rise);
        tl.to("#s3-holder", { rotationY: -5, rotationX: 5, y: 175, duration: T.dive - 1.2 - T.rise, ease: "sine.inOut" }, T.rise + 1.05);
        tl.fromTo("#s3-hud", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, T.chronoIn - 0.1);
        tl.fromTo("#s3-chrono", { scale: 0.6, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.4)" }, T.chronoIn);
        stepIn("#s3-st0", T.chronoIn + 0.15);
        // bandeau du haut : seulement quand le téléphone est zoomé
        tl.set("#s3-hud-bg", { opacity: 0 }, 0);
        tl.to("#s3-hud-bg", { opacity: 1, duration: 0.35, ease: "power2.out" }, T.dive + 0.2);
        tl.to("#s3-hud-bg", { opacity: 0, duration: 0.3, ease: "power2.in" }, T.s3);
        tl.to("#s3-hud-bg", { opacity: 1, duration: 0.3, ease: "power2.out" }, T.back + 0.25);
        tl.to("#s3-hud-bg", { opacity: 0, duration: 0.3, ease: "power2.in" }, T.recede);

        // ---------- plongée dans le formulaire ----------
        tl.to("#s3-page", { y: -SCROLL, duration: 0.9, ease: "power2.inOut" }, T.dive);
        camTo($("#s3-f-dep"), ZOOM, T.dive, 0.9, "power2.inOut", 0);
        tl.to(clock, { s: CHRONO_STOP, duration: T.tapSend - T.s1, ease: "none", onUpdate: fmt }, T.s1);

        // ---------- étape 1 : trajet ----------
        stepIn("#s3-st1", T.s1, "#s3-st0");
        segFill(0, T.s1, T.s2 - T.s1);
        touchAt($("#s3-f-dep"), T.tapDep);
        let d = typeIn("#s3-f-dep", "Gare de Lyon, Paris 12e", T.tapDep);
        blur($("#s3-f-dep"), T.tapArr - 0.1);
        touchAt($("#s3-f-arr"), T.tapArr);
        d = typeIn("#s3-f-arr", "Aéroport Paris-CDG", T.tapArr);
        blur($("#s3-f-arr"), T.s2 + 0.2);

        // ---------- étape 2 : date, passagers, bagages ----------
        stepIn("#s3-st2", T.s2, "#s3-st1");
        segFill(1, T.s2, T.s3 - T.s2);
        camTo($("#s3-f-date"), ZOOM, T.s2, 0.7, "power2.inOut", 0);
        touchAt($("#s3-f-date"), T.tapDate); pick("#s3-f-date", "12 déc. 2026", T.tapDate);
        touchAt($("#s3-f-time"), T.tapTime); pick("#s3-f-time", "06:30", T.tapTime);
        touchAt($("#s3-f-pax"), T.tapPax); pick("#s3-f-pax", "2 passagers", T.tapPax);
        touchAt($("#s3-f-bag"), T.tapBag); pick("#s3-f-bag", "2 bagages", T.tapBag);

        // ---------- étape 3 : véhicule (cartes Éco / Berline du site) ----------
        stepIn("#s3-st3", T.s3, "#s3-st2");
        segFill(2, T.s3, T.s4 - T.s3);
        tl.to("#s3-holder", { scale: 1.15, y: 520, rotationX: 22, duration: 0.7, ease: "power3.inOut" }, T.s3);
        tl.to("#s3-dim", { opacity: 0.55, duration: 0.5 }, T.s3 + 0.1);
        const card = (id, top, ry, at) => {
          tl.fromTo(id, { y: 1150, scale: 0.5, rotationX: 55, rotationY: 0, opacity: 0, z: -200 }, { y: top, scale: 1.7, rotationX: 8, rotationY: ry, z: 0, opacity: 1, duration: 0.85, ease: "back.out(1.1)" }, at);
        };
        card("#s3-veco", 525, 9, T.s3 + 0.25);
        card("#s3-vber", 925, -9, T.s3 + 0.42);
        tl.to("#s3-veco", { rotationY: 4, duration: 1.3, ease: "sine.inOut" }, T.s3 + 1.1);
        tl.to("#s3-vber", { rotationY: -4, duration: 1.2, ease: "sine.inOut" }, T.s3 + 1.27);
        // tap sur « Réserver » de la carte Berline
        tl.set("#s3-touch2", { x: 540, y: 1081 }, T.tapBer - 0.2);
        tl.fromTo("#s3-touch2", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.14 }, T.tapBer - 0.2);
        tl.to("#s3-touch2", { scale: 0.78, duration: 0.08, ease: "power4.in" }, T.tapBer - 0.04);
        tl.to("#s3-touch2", { scale: 1, opacity: 0, duration: 0.25, ease: "power2.out" }, T.tapBer + 0.08);
