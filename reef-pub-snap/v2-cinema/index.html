<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #050403; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #050403; }
      #fond { z-index: 0; } #world { z-index: 1; } #overlay { z-index: 2; } #captions { z-index: 3; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <!-- REEF 33 — Pub Snap n°1 « Luxe Cinéma » (30 s) -->
      <div id="fond" data-composition-id="fond" data-composition-src="compositions/fond.html" data-start="0" data-duration="30" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="world" data-composition-id="world" data-composition-src="compositions/world.html" data-start="0" data-duration="30" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="overlay" data-composition-id="overlay" data-composition-src="compositions/overlay.html" data-start="0" data-duration="30" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
