<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #050403; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #050403; }
      #fond { z-index: 0; } #world { z-index: 1; } #overlay { z-index: 2; } #captions { z-index: 3; } #leak { z-index: 2; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <!-- REEF 33 — Pub Snap n°1 « Luxe Cinéma » (30 s) -->
      <div id="fond" data-composition-id="fond" data-composition-src="compositions/fond.html" data-start="0" data-duration="30" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="world" data-composition-id="world" data-composition-src="compositions/world.html" data-start="0" data-duration="30" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="overlay" data-composition-id="overlay" data-composition-src="compositions/overlay.html" data-start="0" data-duration="30" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <!-- voile de lumière : bloc organic-light-leak-overlay du registre, sur le passage désert → chapitres -->
      <div id="leak" data-composition-id="organic-light-leak-overlay" data-composition-src="compositions/organic-light-leak-overlay.html" data-start="6.4" data-duration="3.2" data-track-index="7" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="30" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920"></div>
      <!-- voix off (Piper, voix IA locale) -->
      <audio id="vo1" class="clip" src="assets/audio/vo1.wav" data-start="0.5" data-duration="1.198" data-track-index="4" data-volume="1"></audio>
      <audio id="vo2" class="clip" src="assets/audio/vo2.wav" data-start="2.4" data-duration="3.288" data-track-index="4" data-volume="1"></audio>
      <audio id="vo3" class="clip" src="assets/audio/vo3.wav" data-start="8.5" data-duration="2.156" data-track-index="4" data-volume="1"></audio>
      <audio id="vo4" class="clip" src="assets/audio/vo4.wav" data-start="11.8" data-duration="2.323" data-track-index="4" data-volume="1"></audio>
      <audio id="vo5" class="clip" src="assets/audio/vo5.wav" data-start="15.1" data-duration="1.717" data-track-index="4" data-volume="1"></audio>
      <audio id="vo6" class="clip" src="assets/audio/vo6.wav" data-start="19.2" data-duration="1.349" data-track-index="4" data-volume="1"></audio>
      <audio id="vo7" class="clip" src="assets/audio/vo7.wav" data-start="27.5" data-duration="1.098" data-track-index="4" data-volume="1"></audio>
      <!-- son : musique et bruitages composés par synthèse (shared/synth_audio.py) -->
      <audio id="music" class="clip" src="assets/audio/music-ducked.wav" data-start="0" data-duration="30" data-track-index="5" data-volume="0.6"></audio>
      <audio id="sfx" class="clip" src="assets/audio/sfx.wav" data-start="0" data-duration="30" data-track-index="6" data-volume="0.85"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
