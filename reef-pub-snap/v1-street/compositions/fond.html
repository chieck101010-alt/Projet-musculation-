<!doctype html>
<!-- REEF 33 — Pub 1 : fonds derrière le flacon 3D (lueurs, teintes des ingrédients, rayures dorées). -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #070605; }
      #fond-root { position: absolute; inset: 0; overflow: hidden; background: #070605; }
      .layer { position: absolute; inset: 0; opacity: 0; }
      #glow { background: radial-gradient(ellipse 70% 38% at 50% 40%, rgba(201,164,92,0.42), rgba(201,164,92,0) 70%), #070605; opacity: 1; }
      #warm { background: radial-gradient(ellipse 90% 60% at 50% 45%, #3a2510 0%, #120c06 60%, #050403 100%); }
      #violet { background: radial-gradient(ellipse 75% 45% at 50% 40%, rgba(139,92,246,0.55), rgba(139,92,246,0) 70%), #0b0710; }
      #vert { background: radial-gradient(ellipse 75% 45% at 50% 40%, rgba(77,124,74,0.6), rgba(77,124,74,0) 70%), #060a06; }
      #brun { background: radial-gradient(ellipse 75% 45% at 50% 40%, rgba(150,100,55,0.6), rgba(107,74,47,0) 70%), #0b0805; }
      #rayures-wrap { overflow: hidden; }
      #rayures {
        position: absolute; left: -900px; top: -900px; width: 2900px; height: 3700px;
        background: repeating-linear-gradient(-58deg, #0a0806 0 70px, #c9a45c 70px 78px, #0a0806 78px 150px, #6b4e22 150px 154px);
      }
      #rayures-ombre { position: absolute; inset: 0; background: radial-gradient(ellipse 55% 40% at 50% 40%, rgba(0,0,0,0.25), rgba(0,0,0,0.85) 80%); }
      #noir { background: radial-gradient(ellipse 60% 35% at 50% 32%, rgba(201,164,92,0.25), rgba(0,0,0,0) 70%), #030303; }
      .ing { position: absolute; opacity: 0; filter: drop-shadow(0 18px 30px rgba(0,0,0,0.6)); }
      #safran { width: 270px; left: 640px; top: 470px; }
      #romarin { width: 400px; left: 20px; top: 640px; }
      #oud { width: 230px; left: 650px; top: 980px; }
      #final { background: radial-gradient(ellipse 70% 40% at 50% 42%, rgba(201,164,92,0.5), rgba(201,164,92,0) 70%), #050403; }
    </style>
  </head>
  <body>
    <div id="fond-root" data-composition-id="fond" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div id="glow" class="layer"></div>
      <div id="warm" class="layer"></div>
      <div id="violet" class="layer"></div>
      <div id="vert" class="layer"></div>
      <div id="brun" class="layer"></div>
      <div id="rayures-wrap" class="layer"><div id="rayures"></div><div id="rayures-ombre"></div></div>
      <div id="noir" class="layer"></div>
      <div id="final" class="layer"></div>
      <!-- ingrédients découpés du packshot officiel, posés derrière le flacon comme sur la photo -->
      <img id="safran" class="ing" src="assets/cut/safran.png" alt="safran" />
      <img id="romarin" class="ing" src="assets/cut/romarin.png" alt="romarin" />
      <img id="oud" class="ing" src="assets/cut/oud.png" alt="oud" />
    </div>
    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        function cut(id, t) { tl.set("#" + id, { opacity: 1 }, t); }
        function off(id, t) { tl.set("#" + id, { opacity: 0 }, t); }
        // S1 lueur dorée (visible dès l'image 0), pulsation à l'impact
        tl.fromTo("#glow", { scale: 1 }, { scale: 1.12, duration: 0.25, ease: "power2.out" }, 0.38);
        tl.to("#glow", { scale: 1, duration: 0.8, ease: "power2.inOut" }, 0.63);
        // S2 macro
        cut("warm", 1.5); off("glow", 1.5);
        // S3 teintes des ingrédients (fondus enchaînés)
        cut("violet", 6); off("warm", 6);
        tl.to("#vert", { opacity: 1, duration: 0.3 }, 7.85); tl.set("#violet", { opacity: 0 }, 8.2);
        tl.to("#brun", { opacity: 1, duration: 0.3 }, 9.65); tl.set("#vert", { opacity: 0 }, 10);
        tl.fromTo("#safran", { opacity: 0, x: 160, rotation: 18 }, { opacity: 1, x: 0, rotation: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 6.15);
        tl.fromTo("#romarin", { opacity: 0, x: -200, rotation: -20 }, { opacity: 1, x: 0, rotation: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 7.95);
        tl.fromTo("#oud", { opacity: 0, y: 200, rotation: 25 }, { opacity: 1, y: 0, rotation: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 9.75);
        tl.to("#safran", { y: -24, duration: 7.2, ease: "sine.inOut" }, 6.65);
        tl.to("#romarin", { y: 24, duration: 5.4, ease: "sine.inOut" }, 8.45);
        tl.to("#oud", { y: -18, duration: 3.6, ease: "sine.inOut" }, 10.25);
        tl.to(["#safran", "#romarin", "#oud"], { opacity: 0, duration: 0.15 }, 13.85);
        // S4 rayures diagonales qui défilent
        cut("rayures-wrap", 14); off("brun", 14);
        tl.fromTo("#rayures", { x: 0, y: 0 }, { x: -320, y: 200, duration: 8, ease: "none" }, 14);
        // S5 prix
        cut("noir", 22); off("rayures-wrap", 22);
        // S6 final
        tl.to("#final", { opacity: 1, duration: 0.4 }, 27); tl.set("#noir", { opacity: 0 }, 27.4);
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["fond"] = tl;
      })();
    </script>
  </body>
</html>
