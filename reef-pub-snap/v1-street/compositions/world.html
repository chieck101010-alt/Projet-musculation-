<!doctype html>
<!--
  REEF 33 — Pub 1 « Luxe Street » : le flacon 3D, plan par plan.
  Canvas transparent : les fonds sont dessinés par la composition "fond" en dessous.
  Seek-safe : chaque image = render(t).
-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #world-root { position: absolute; inset: 0; overflow: hidden; }
      #world-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; }
    </style>
  </head>
  <body>
    <div id="world-root" data-composition-id="world" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <canvas id="world-canvas" width="1080" height="1920"></canvas>
    </div>

    <script>
      (function () {
        var root = document.getElementById("world-root");
        var duration = parseFloat(root.dataset.duration) || 30;
        var clock = { t: 0 };
        var host = { clock: clock, render: null };
        window.__world = host;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["world"] = new Promise(function (resolve) { host.ready = resolve; });
        var tl = gsap.timeline({ paused: true });
        tl.to(clock, { t: duration, duration: duration, ease: "none",
          onUpdate: function () { if (host.render) host.render(clock.t); } });
        window.__timelines = window.__timelines || {};
        window.__timelines["world"] = tl;
      })();
    </script>

    <script type="module">
      import * as THREE from "./assets/lib/three.module.min.js";
      import { DIM, studioEnv, buildBottle, lerp, seg, E } from "./assets/lib/reef-bottle.js";

      const host = window.__world;
      const W = 1080, H = 1920, DEG = Math.PI / 180;

      const canvas = document.getElementById("world-canvas");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.setClearColor(0x000000, 0);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(26, W / H, 0.05, 60);
      let bottle, key, rim, shadowCatcher;

      async function build() {
        scene.environment = studioEnv(THREE, renderer);
        scene.environmentIntensity = 0.55;
        const b = await buildBottle(THREE, "assets/tex/plaque-reef33.png");
        bottle = b.group; scene.add(bottle);

        shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.ShadowMaterial({ opacity: 0.55 }));
        shadowCatcher.rotation.x = -Math.PI / 2; shadowCatcher.receiveShadow = true; scene.add(shadowCatcher);

        key = new THREE.SpotLight(0xffe6c0, 60, 14, 0.5, 0.6, 1.3);
        key.position.set(-3.2, 4.2, 3.4); key.target.position.set(0, 1.1, 0);
        key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 6;
        scene.add(key, key.target);
        rim = new THREE.DirectionalLight(0x9fc0ff, 1.4); rim.position.set(3, 3, -3); scene.add(rim);
        const fill = new THREE.DirectionalLight(0xffd9a0, 0.35); fill.position.set(2, 1, 4); scene.add(fill);
        await renderer.compileAsync(scene, camera);
      }

      // Caméra orbitale : azimut, élévation, distance, hauteur visée, décalage écran (px, + = sujet plus haut).
      function shoot(az, el, dist, ty, lift) {
        const a = az * DEG, e = el * DEG;
        camera.position.set(dist * Math.sin(a) * Math.cos(e), ty + dist * Math.sin(e), dist * Math.cos(a) * Math.cos(e));
        camera.lookAt(0, ty, 0);
        camera.setViewOffset(W, H, 0, lift, W, H);
        camera.updateProjectionMatrix();
      }
      // tremblement déterministe
      const shake = (t, amp) => amp * (Math.sin(t * 91.7) * 0.6 + Math.sin(t * 57.3 + 1.3) * 0.4);

      const CY = 1.34; // milieu du flacon
      function render(t) {
        let rotY = 0, posY = 0, keyX = -3.2, showShadow = 1;

        if (t < 1.5) {
          // S1 — le flacon tombe et claque au sol ; il est déjà visible à l'image 0
          const k = seg(t, 0, 0.38);
          posY = lerp(0.45, 0, E.in2(k));
          const after = Math.max(0, t - 0.38);
          posY += after > 0 ? 0.06 * Math.exp(-after * 9) * Math.abs(Math.sin(after * 22)) : 0;
          const sh = after > 0 ? shake(t, 0.06 * Math.exp(-after * 5)) : 0;
          rotY = lerp(-14, 0, E.out3(seg(t, 0, 0.6))) * DEG;
          shoot(sh * 40, 6 + sh * 20, lerp(12.8, 12.2, seg(t, 0, 1.5)), CY + sh, 60);
        } else if (t < 6) {
          // S2 — macro sur la plaque gravée : la caméra descend de la fleur jusqu'au « 33 »
          const k = E.inOut2(seg(t, 1.5, 6));
          const ty = lerp(DIM.BH / 2 + DIM.PL_Y + 0.62, DIM.BH / 2 + DIM.PL_Y - 0.62, k);
          rotY = lerp(10, -6, k) * DEG;
          keyX = lerp(-3.6, 2.0, k);
          shoot(0, 2, lerp(2.3, 2.05, k), ty, 180);
          showShadow = 0;
        } else if (t < 14) {
          // S3 — ingrédients : rotation lente, le flacon reste au centre
          const k = seg(t, 6, 14);
          rotY = lerp(-10, 10, E.inOut2(k)) * DEG;
          posY = 0.05 * Math.sin((t - 6) * 1.4);
          keyX = lerp(-3.2, 1.0, k);
          shoot(0, 6, lerp(12.6, 11.8, E.inOut2(k)), CY, 60);
        } else if (t < 22) {
          // S4 — héros : rotation 3/4 gauche → 3/4 droite, poussée caméra, reflet qui balaie
          const k = seg(t, 14, 22);
          const a1 = E.inOut3(seg(t, 14.2, 17.6)), a2 = E.inOut3(seg(t, 18, 21.6));
          rotY = lerp(lerp(0, -52, a1), 40, a2) * DEG;
          keyX = lerp(-3.6, 2.2, E.inOut2(k));
          shoot(0, lerp(3, 10, k), lerp(12.6, 11.6, E.inOut2(k)), CY, 60);
        } else if (t < 27) {
          // S5 — prix : plongée sur le bouchon, petit coup de fouet à l'entrée
          const k = seg(t, 22, 27);
          const whip = 1 - E.out4(seg(t, 22, 22.45));
          rotY = (lerp(32, 18, k) + whip * 40) * DEG;
          keyX = 1.6;
          shoot(0, lerp(20, 14, k), lerp(7.4, 6.8, k), lerp(1.75, 1.6, k), -60);
        } else {
          // S6 — plan final : face, centré, léger recul
          const k = E.out3(seg(t, 27, 30));
          rotY = lerp(-8, 0, k) * DEG;
          keyX = lerp(-3.2, -2.4, k);
          shoot(0, 5, lerp(14.2, 15.2, k), CY, 270);
        }

        bottle.rotation.y = rotY;
        bottle.position.y = posY;
        key.position.x = keyX;
        shadowCatcher.visible = !!showShadow;
        renderer.render(scene, camera);
      }

      await build();
      host.render = render;
      render(host.clock.t);
      host.ready();
    </script>
  </body>
</html>
