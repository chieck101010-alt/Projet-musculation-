<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #070605; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #070605; }
      #fond { z-index: 0; } #world { z-index: 1; } #overlay { z-index: 2; } #captions { z-index: 3; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <!-- REEF 33 — Pub Snap n°1 « Luxe Street » (30 s) -->
      <div id="fond" data-composition-id="fond" data-composition-src="compositions/fond.html" data-start="0" data-duration="30" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="world" data-composition-id="world" data-composition-src="compositions/world.html" data-start="0" data-duration="30" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="overlay" data-composition-id="overlay" data-composition-src="compositions/overlay.html" data-start="0" data-duration="30" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="30" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920"></div>
      <!-- voix off (Piper, voix IA locale) -->
      <audio id="vo1" class="clip" src="assets/audio/vo1.wav" data-start="0.25" data-duration="1.157" data-track-index="4" data-volume="1"></audio>
      <audio id="vo2" class="clip" src="assets/audio/vo2.wav" data-start="2.0" data-duration="1.504" data-track-index="4" data-volume="1"></audio>
      <audio id="vo3" class="clip" src="assets/audio/vo3.wav" data-start="6.25" data-duration="4.324" data-track-index="4" data-volume="1"></audio>
      <audio id="vo4" class="clip" src="assets/audio/vo4.wav" data-start="14.8" data-duration="3.807" data-track-index="4" data-volume="1"></audio>
      <audio id="vo5" class="clip" src="assets/audio/vo5.wav" data-start="22.45" data-duration="2.726" data-track-index="4" data-volume="1"></audio>
      <audio id="vo6" class="clip" src="assets/audio/vo6.wav" data-start="27.3" data-duration="2.517" data-track-index="4" data-volume="1"></audio>
      <!-- son : musique et bruitages composés par synthèse (shared/synth_audio.py) -->
      <audio id="music" class="clip" src="assets/audio/music-ducked.wav" data-start="0" data-duration="30" data-track-index="5" data-volume="0.55"></audio>
      <audio id="sfx" class="clip" src="assets/audio/sfx.wav" data-start="0" data-duration="30" data-track-index="6" data-volume="0.9"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
