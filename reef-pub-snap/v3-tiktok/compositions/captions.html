<!doctype html>
<!-- REEF 33 — sous-titres de la voix off, phrase par phrase, calés sur la durée réelle de chaque phrase. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #captions-root { position: absolute; inset: 0; overflow: hidden; }
      .cap { position: absolute; left: 110px; width: 860px; top: 1265px; text-align: center; opacity: 0; line-height: 1.5; }
      .cap span { font-family:'Poppins',sans-serif;font-weight:700;font-size:42px;color:#fff;background:rgba(0,0,0,0.55);padding:8px 20px;border-radius:12px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
    </style>
  </head>
  <body>
    <div id="captions-root" data-composition-id="captions" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div id="c1" class="cap"><span>Non mais faut que j&#x27;vous parle de ça.</span></div>
      <div id="c2" class="cap"><span>J&#x27;l&#x27;ai pris à 65 balles, il sent comme un truc à 200.</span></div>
      <div id="c3" class="cap"><span>Safran, romarin, oud. Ça sent le luxe, mais pas le vieux.</span></div>
      <div id="c4" class="cap"><span>Et la tenue… le soir, tu le sens encore.</span></div>
      <div id="c5" class="cap"><span>REEF 33. Après, faut pas v&#x27;nir pleurer qu&#x27;on te pique ton parfum.</span></div>
    </div>
    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        function show(id, a, b) {
          tl.fromTo("#" + id, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.15, ease: "power2.out", immediateRender: false }, a);
          tl.to("#" + id, { opacity: 0, duration: 0.12 }, b);
        }
        show("c1", 0.15, 1.458);
        show("c2", 2.2, 5.527);
        show("c3", 8.3, 12.575);
        show("c4", 17.0, 20.342);
        show("c5", 24.4, 28.811);
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["captions"] = tl;
      })();
    </script>
  </body>
</html>
