  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const num = document.getElementById("in-num");
      // frame 0 already reads: photo, stamp, title
      tl.fromTo("#in-photo", { rotationY: 18, x: -30, scale: 1.04 }, { rotationY: 8, x: 0, scale: 1, duration: 6.2, ease: "power2.out" }, 0);

      // the day counter rolls 01 → 90 like an odometer
      const c = { v: 1 };
      tl.fromTo(
        c,
        { v: 1 },
        {
          v: 90,
          duration: 1.6,
          ease: "power3.inOut",
          onUpdate: () => {
            num.textContent = String(Math.round(c.v)).padStart(2, "0");

        3.4,
      );
      tl.fromTo("#in-num", { scale: 1 }, { scale: 1.08, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, 5.0);
