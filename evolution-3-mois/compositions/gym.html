<!doctype html>
<!--
  Évolution 3 mois — the 3D gym: an anatomical mannequin performs the full 5-day programme.
  Seek-safe: every frame is render(t), driven by one linear GSAP clock.
-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #15171b;
      }
      #gym-root {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #gym-canvas {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="gym-root" data-composition-id="gym" data-start="0" data-duration="86" data-width="1920" data-height="1080">
      <canvas id="gym-canvas" width="1920" height="1080"></canvas>
    </div>

    <script>
      (function () {
        var root = document.getElementById("gym-root");
        var duration = parseFloat(root.dataset.duration) || 86;
        var clock = { t: 0 };
        var host = { clock: clock, duration: duration, render: null };
        window.__gym = host;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["gym"] = new Promise(function (resolve) {
          host.ready = resolve;
        });
        var tl = gsap.timeline({ paused: true });
        tl.to(clock, {
          t: duration,
          duration: duration,
          ease: "none",
          onUpdate: function () {
            if (host.render) host.render(clock.t);
          },
        });
        window.__timelines = window.__timelines || {};
        window.__timelines["gym"] = tl;
      })();
    </script>

    <script type="module">
      import * as THREE from "./assets/lib/three.module.min.js";

      const host = window.__gym;
      const W = 1920, H = 1080;
      const DEG = Math.PI / 180;
      const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
      const lerp = (a, b, x) => a + (b - a) * x;
      const seg = (t, a, b) => clamp01((t - a) / (b - a));
      const Ez = {
        lin: (x) => x,
        in2: (x) => x * x,
        in3: (x) => x * x * x,
        out2: (x) => 1 - (1 - x) * (1 - x),
        out3: (x) => 1 - Math.pow(1 - x, 3),
        out4: (x) => 1 - Math.pow(1 - x, 4),
        inOut2: (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2),
        inOut3: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
        back: (x, s = 1.7) => { const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); },
      };
      const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      // ================= TIMELINE (seconds, film time) =================
      const T_REVEAL = 7.0;
      const SLOT = 2.8, CARD = 1.4;
      const DAYS = [
        { day: 1, card: 12.2, ex: ["bench", "incline", "pecdeck", "rope", "overhead", "skull"] },
        { day: 2, card: 30.4, ex: ["bbrow", "cablerow", "pulldown", "preacher", "hammer", "bbcurl"] },
        { day: 4, card: 54.6, ex: ["revfly", "frontraise", "latraise", "dbpress"] },
        { day: 5, card: 67.2, ex: ["pulley", "overhead", "skull", "bbcurl", "hammer", "preacher"] },
      ];
      const T_REST = 48.6, T_REST_END = 54.6, T_OUT = 85.4;
      // flatten into slots
      const SLOTS = [];
      for (const d of DAYS) {
        SLOTS.push({ kind: "card", day: d.day, t0: d.card, t1: d.card + CARD, ex: d.ex[0] });
        d.ex.forEach((e, k) => {
          const t0 = d.card + CARD + k * SLOT;
          SLOTS.push({ kind: "ex", day: d.day, t0, t1: t0 + SLOT, ex: e, k });
        });
        if (d.day === 2) SLOTS.push({ kind: "rest", day: 3, t0: T_REST, t1: T_REST_END, ex: "rest" });
      }
      SLOTS.sort((a, b) => a.t0 - b.t0);

      // ================= RENDERER =================
      const canvas = document.getElementById("gym-canvas");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x15171b);
      scene.fog = new THREE.Fog(0x15171b, 9, 22);
      const camera = new THREE.PerspectiveCamera(34, W / H, 0.05, 80);

      const P = {
        clay: 0xd8dce2, muscle: 0xc4cad3, accent: 0xff4d2e, floor: 0x2a2c31, wall: 0x3a3d43,
        steel: 0x9aa1ab, dark: 0x1c1e22, pad: 0x23252a, wood: 0xa8774a, rubber: 0x18191c, chrome: 0xc9ced6,
      };
      const C_ACC = new THREE.Color(P.accent);
      const std = (color, rough = 0.55, metal = 0.05) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
      const matCache = new Map();
      const M = (c, r = 0.55, m = 0.05) => { const k = c + "|" + r + "|" + m; if (!matCache.has(k)) matCache.set(k, std(c, r, m)); return matCache.get(k); };
      const asMat = (m) => (typeof m === "number" ? M(m) : m);
      function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene, cast = true, recv = true) {
        const o = new THREE.Mesh(geo, asMat(mat));
        o.position.set(x, y, z); o.castShadow = cast; o.receiveShadow = recv; parent.add(o); return o;
      }
      const box = (w, h, d, m, x, y, z, p, c, r) => mesh(new THREE.BoxGeometry(w, h, d), m, x, y, z, p, c, r);
      const cyl = (rt, rb, h, s, m, x, y, z, p) => mesh(new THREE.CylinderGeometry(rt, rb, h, s), m, x, y, z, p);
      const sph = (r, m, x, y, z, p, ws = 20, hs = 14) => mesh(new THREE.SphereGeometry(r, ws, hs), m, x, y, z, p);

      // ================= LIGHTS =================
      const hemi = new THREE.HemisphereLight(0x9fb4d8, 0x2a2622, 0.55);
      scene.add(hemi);
      const key = new THREE.SpotLight(0xfff1e0, 90, 14, 0.62, 0.55, 1.4);
      key.position.set(0.6, 5.2, 1.6);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.bias = -0.0003;
      key.shadow.normalBias = 0.02;
      scene.add(key); scene.add(key.target);
      key.target.position.set(0, 0.8, 0);
      const rimCool = new THREE.DirectionalLight(0x6fa2ff, 1.6);
      rimCool.position.set(-4, 3.2, -4.5);
      scene.add(rimCool);
      const rimWarm = new THREE.DirectionalLight(0xffa05a, 1.1);
      rimWarm.position.set(4.5, 2.6, -3.5);
      scene.add(rimWarm);
      const fill = new THREE.DirectionalLight(0xffffff, 0.35);
      fill.position.set(2, 2, 5);
      scene.add(fill);

      // ================= GYM SET =================
      function canvasTex(w, h, draw) {
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        draw(c.getContext("2d"), w, h);
        const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
      }
      const lightStrips = [];
      const coneMats = [];
      async function buildGym() {
        // floor: rubber tiles
        const floorTex = canvasTex(1024, 1024, (g, w, h) => {
          g.fillStyle = "#26282d"; g.fillRect(0, 0, w, h);
          const r = mulberry32(3);
          for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(255,255,255,${r() * 0.035})`; g.fillRect(r() * w, r() * h, 2, 2); }
          g.strokeStyle = "rgba(0,0,0,0.55)"; g.lineWidth = 4;
          for (let i = 0; i <= 8; i++) { g.beginPath(); g.moveTo(i * 128, 0); g.lineTo(i * 128, h); g.stroke(); g.beginPath(); g.moveTo(0, i * 128); g.lineTo(w, i * 128); g.stroke(); }
        });
        floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(5, 5);
        const floor = mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.82, metalness: 0 }), 0, 0, 0, scene, false, true);
        floor.rotation.x = -Math.PI / 2;
        // lifting platform
        box(3.4, 0.05, 3.4, P.rubber, 0, 0.025, 0, scene, false, true);
        const woodTex = canvasTex(512, 512, (g, w, h) => {
          g.fillStyle = "#a8774a"; g.fillRect(0, 0, w, h);
          for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? "rgba(0,0,0,0.08)" : "rgba(255,255,255,0.05)"; g.fillRect(i * 64, 0, 64, h); }
          const r = mulberry32(9);
          for (let i = 0; i < 400; i++) { g.strokeStyle = `rgba(60,30,10,${0.05 + r() * 0.08})`; g.beginPath(); const x = r() * w; g.moveTo(x, 0); g.bezierCurveTo(x + 8, h * 0.3, x - 8, h * 0.6, x + 4, h); g.stroke(); }
        });
        mesh(new THREE.BoxGeometry(1.9, 0.052, 3.4), new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.6 }), 0, 0.027, 0, scene, false, true);
        // room: 4 concrete walls
        const wallTex = canvasTex(1024, 512, (g, w, h) => {
          g.fillStyle = "#3a3d43"; g.fillRect(0, 0, w, h);
          const r = mulberry32(21);
          for (let i = 0; i < 14000; i++) { const v = r(); g.fillStyle = `rgba(${v > 0.5 ? 255 : 0},${v > 0.5 ? 255 : 0},${v > 0.5 ? 255 : 0},${r() * 0.05})`; g.fillRect(r() * w, r() * h, 2 + r() * 3, 2 + r() * 3); }
          g.strokeStyle = "rgba(0,0,0,0.35)"; g.lineWidth = 3;
          for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(i * 256, 0); g.lineTo(i * 256, h); g.stroke(); }
          g.beginPath(); g.moveTo(0, 256); g.lineTo(w, 256); g.stroke();
        });
        wallTex.wrapS = THREE.RepeatWrapping; wallTex.repeat.set(2, 1);
        const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.9 });
        const R = 7;
        const walls = [
          [0, 2.6, -R, 0], [0, 2.6, R, Math.PI], [-R, 2.6, 0, Math.PI / 2], [R, 2.6, 0, -Math.PI / 2],
        ];
        for (const [x, y, z, ry] of walls) { const w = mesh(new THREE.PlaneGeometry(2 * R, 5.2), wallMat, x, y, z, scene, false, true); w.rotation.y = ry; }
        // ceiling
        const ceil = mesh(new THREE.PlaneGeometry(2 * R, 2 * R), M(0x1a1c20, 0.95), 0, 5.2, 0, scene, false, false);
        ceil.rotation.x = Math.PI / 2;
        // vertical LED strips on the walls
        const stripMat = new THREE.MeshBasicMaterial({ color: 0xf4f6ff });
        for (const [axis, sgn] of [["z", -1], ["x", -1], ["x", 1], ["z", 1]]) {
          for (let i = -2; i <= 2; i++) {
            const s = box(0.08, 3.6, 0.04, stripMat, 0, 2.3, 0, scene, false, false);
            if (axis === "z") s.position.set(i * 2.4, 2.3, sgn * (R - 0.03));
            else { s.position.set(sgn * (R - 0.03), 2.3, i * 2.4); s.rotation.y = Math.PI / 2; }
            lightStrips.push(s);
          }
        }
        // ceiling light bars
        for (let i = -1; i <= 1; i++) box(0.16, 0.05, 4.5, stripMat, i * 2.2, 5.15, 0, scene, false, false);
        // big painted "90" on the back wall
        const ninety = canvasTex(1024, 512, (g, w, h) => {
          g.clearRect(0, 0, w, h);
          g.font = "700 470px Oswald, Impact, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
          g.fillStyle = "rgba(240,242,246,0.13)"; g.fillText("90", w / 2, h / 2 + 20);
        });
        const n90 = mesh(new THREE.PlaneGeometry(6, 3), new THREE.MeshBasicMaterial({ map: ninety, transparent: true, depthWrite: false }), 0.6, 2.7, -R + 0.05, scene, false, false);
        // dumbbell rack along the left wall
        const rackX = -R + 0.6;
        box(0.5, 0.06, 5.2, P.dark, rackX, 0.55, 0); box(0.5, 0.06, 5.2, P.dark, rackX, 0.95, 0);
        for (const z of [-2.5, 0, 2.5]) box(0.08, 1.0, 0.08, P.dark, rackX, 0.5, z);
        const plateMat = M(0x2b2d31, 0.5, 0.3), chromeMat = M(P.chrome, 0.25, 0.9);
        for (let row = 0; row < 2; row++)
          for (let i = 0; i < 10; i++) {
            const z = -2.25 + i * 0.5, y = row ? 1.06 : 0.66, s = 0.8 + i * 0.03;
            const db = new THREE.Group(); db.position.set(rackX, y, z); scene.add(db);
            const h1 = cyl(0.02, 0.02, 0.3, 8, chromeMat, 0, 0, 0, db); h1.rotation.x = Math.PI / 2;
            for (const e of [-0.13, 0.13]) { const hd = cyl(0.07 * s, 0.07 * s, 0.07, 14, plateMat, 0, 0, e, db); hd.rotation.x = Math.PI / 2; }
          }
        // squat rack in the back-right corner
        const rk = new THREE.Group(); rk.position.set(4.4, 0, -5.2); scene.add(rk);
        for (const [x, z] of [[-0.6, -0.5], [0.6, -0.5], [-0.6, 0.5], [0.6, 0.5]]) box(0.08, 2.4, 0.08, P.dark, x, 1.2, z, rk);
        for (const z of [-0.5, 0.5]) box(1.3, 0.08, 0.08, P.dark, 0, 2.4, z, rk);
        const rb = cyl(0.025, 0.025, 2.0, 10, chromeMat, 0, 1.4, 0.55, rk); rb.rotation.z = Math.PI / 2;
        for (const x of [-0.8, 0.8]) { const p = cyl(0.22, 0.22, 0.06, 24, plateMat, x, 1.4, 0.55, rk); p.rotation.z = Math.PI / 2; }
        // plate tree
        const pt = new THREE.Group(); pt.position.set(-4.6, 0, -5.4); scene.add(pt);
        cyl(0.04, 0.04, 1.2, 8, P.dark, 0, 0.6, 0, pt);
        for (let i = 0; i < 4; i++) { const p = cyl(0.23 - i * 0.03, 0.23 - i * 0.03, 0.05, 24, plateMat, 0, 0.35 + i * 0.22, 0.07, pt); p.rotation.x = Math.PI / 2; }
        // volumetric key cone
        const coneMat = new THREE.MeshBasicMaterial({ color: 0xfff1e0, transparent: true, opacity: 0.06, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
        coneMats.push(coneMat);
        const cone = mesh(new THREE.ConeGeometry(2.0, 5.1, 40, 1, true), coneMat, 0.3, 2.6, 0.8, scene, false, false);
        cone.lookAt(0.3, 10, 0.8);
        cone.rotation.x = 0;
        // floor light pool
        const poolTex = canvasTex(256, 256, (g, w, h) => {
          const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
          gr.addColorStop(0, "rgba(255,240,220,0.35)"); gr.addColorStop(1, "rgba(255,240,220,0)");
          g.fillStyle = gr; g.fillRect(0, 0, w, h);
        });
        const pool = mesh(new THREE.PlaneGeometry(4.2, 4.2), new THREE.MeshBasicMaterial({ map: poolTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }), 0.2, 0.06, 0.4, scene, false, false);
        pool.rotation.x = -Math.PI / 2;
        coneMats.push(pool.material);
      }

      // ================= MANNEQUIN =================
      const BODY = { a: 0.3, b: 0.29, th: 0.45, sh: 0.45 };
      const clay = new THREE.MeshStandardMaterial({ color: P.clay, roughness: 0.42, metalness: 0.04 });
      const joint = new THREE.MeshStandardMaterial({ color: 0xb9bfc8, roughness: 0.5, metalness: 0.05 });
      const MUSCLES = ["pec", "pecUp", "deltF", "deltS", "deltR", "tri", "bi", "brach", "lat", "trap", "rhomb", "abs", "quad", "calf"];
      const mMat = {};
      for (const id of MUSCLES) mMat[id] = new THREE.MeshStandardMaterial({ color: P.muscle, roughness: 0.38, metalness: 0.05, emissive: 0x000000 });
      const man = { root: new THREE.Group() };
      scene.add(man.root);
      function ell(rx, ry, rz, mat, x, y, z, parent, rot) {
        const m = sph(1, mat, x, y, z, parent, 24, 16);
        m.scale.set(rx, ry, rz);
        if (rot) m.rotation.set(rot[0] || 0, rot[1] || 0, rot[2] || 0);
        return m;
      }
      function buildMan() {
        const pel = new THREE.Group(); man.root.add(pel); man.pel = pel;
        const tor = new THREE.Group(); pel.add(tor); man.tor = tor;
        // pelvis & torso volumes
        ell(0.155, 0.11, 0.105, clay, 0, -0.03, 0, pel);
        ell(0.14, 0.13, 0.1, clay, 0, 0.12, 0.0, tor);
        ell(0.185, 0.17, 0.12, clay, 0, 0.36, -0.01, tor);
        cyl(0.05, 0.058, 0.12, 14, clay, 0, 0.58, 0.0, tor);
        const head = new THREE.Group(); head.position.set(0, 0.64, 0.01); tor.add(head); man.head = head;
        ell(0.098, 0.12, 0.108, clay, 0, 0.09, 0.0, head);
        ell(0.07, 0.05, 0.06, clay, 0, 0.02, 0.04, head);
        // muscles on the torso
        for (const s of [1, -1]) {
          ell(0.088, 0.062, 0.045, mMat.pec, s * 0.082, 0.405, 0.1, tor, [0, 0, s * 0.18]);
          ell(0.075, 0.034, 0.035, mMat.pecUp, s * 0.085, 0.47, 0.095, tor, [0, 0, s * 0.12]);
          ell(0.062, 0.15, 0.05, mMat.lat, s * 0.145, 0.3, -0.045, tor, [0, 0, s * 0.22]);
          ell(0.045, 0.072, 0.048, mMat.deltF, s * 0.205, 0.5, 0.055, tor);
          ell(0.04, 0.07, 0.05, mMat.deltS, s * 0.25, 0.495, 0.0, tor);
          ell(0.045, 0.068, 0.045, mMat.deltR, s * 0.205, 0.495, -0.058, tor);
        }
        ell(0.13, 0.055, 0.05, mMat.trap, 0, 0.535, -0.055, tor);
        ell(0.085, 0.08, 0.03, mMat.rhomb, 0, 0.4, -0.115, tor);
        for (let r = 0; r < 3; r++) for (const s of [1, -1]) ell(0.034, 0.03, 0.022, mMat.abs, s * 0.036, 0.27 - r * 0.068, 0.098, tor);
        // limb segments (world-space, updated per frame)
        const seg = (r, len, mat) => {
          const g = new THREE.CapsuleGeometry(r, len, 6, 16);
          const m = new THREE.Mesh(g, mat); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
        };
        man.arms = [1, -1].map((s) => ({
          s,
          upper: seg(0.047, BODY.a - 0.04, clay), fore: seg(0.038, BODY.b - 0.05, clay),
          elbow: sph(0.045, joint, 0, 0, 0), hand: ell(0.045, 0.055, 0.03, clay, 0, 0, 0, scene),
          bi: ell(0.042, 0.095, 0.042, mMat.bi, 0, 0, 0, scene), tri: ell(0.045, 0.105, 0.045, mMat.tri, 0, 0, 0, scene),
          brach: ell(0.036, 0.085, 0.036, mMat.brach, 0, 0, 0, scene), shoulder: sph(0.055, joint, 0, 0, 0),
        }));
        man.legs = [1, -1].map((s) => ({
          s,
          thigh: seg(0.07, BODY.th - 0.08, clay), shin: seg(0.052, BODY.sh - 0.07, clay),
          knee: sph(0.06, joint, 0, 0, 0), foot: box(0.1, 0.07, 0.24, clay, 0, 0, 0),
          quad: ell(0.062, 0.17, 0.06, mMat.quad, 0, 0, 0, scene), calf: ell(0.048, 0.1, 0.05, mMat.calf, 0, 0, 0, scene),
        }));
        // the scan ring (reveal)
        man.scan = mesh(new THREE.TorusGeometry(0.42, 0.008, 8, 64), new THREE.MeshBasicMaterial({ color: P.accent }), 0, 0, 0, scene, false, false);
        man.scan.rotation.x = Math.PI / 2;
      }
      const _m4 = new THREE.Matrix4();
      function placeBetween(m, A, B, side, off = 0, frac = 0.5) {
        const y = B.clone().sub(A).normalize();
        let z = side.clone().sub(y.clone().multiplyScalar(side.dot(y)));
        if (z.lengthSq() < 1e-6) z = Math.abs(y.x) < 0.9 ? V3(1, 0, 0) : V3(0, 0, 1);
        z.normalize();
        const x = y.clone().cross(z).normalize();
        _m4.makeBasis(x, y, z);
        m.quaternion.setFromRotationMatrix(_m4);
        m.position.copy(A).lerp(B, frac).addScaledVector(z, off);
      }
      function ik(S, T, a, b, pole) {
        const d = T.clone().sub(S);
        let len = d.length();
        const dir = d.divideScalar(len || 1);
        len = Math.min(Math.max(len, Math.abs(a - b) + 0.02), a + b - 0.002);
        const cosA = (a * a + len * len - b * b) / (2 * a * len);
        const sinA = Math.sqrt(Math.max(0, 1 - cosA * cosA));
        let perp = pole.clone().sub(dir.clone().multiplyScalar(pole.dot(dir)));
        if (perp.lengthSq() < 1e-6) perp = Math.abs(dir.y) < 0.9 ? V3(0, 1, 0) : V3(0, 0, -1);
        perp.normalize();
        const E = S.clone().addScaledVector(dir, a * cosA).addScaledVector(perp, a * sinA);
        const Tn = S.clone().addScaledVector(dir, len);
        return { E, T: Tn, perp };
      }

      // ================= BASES & EXERCISES =================

      function camFor(t) {
        // reveal crane
        if (t < SLOTS[0].t0) {
          const x = Ez.inOut3(seg(t, T_REVEAL - 0.6, 10.6));
          const drift = (t - 10.6) * 2.5;
          return { az: lerp(-30, 32, x) + Math.max(0, drift), el: lerp(38, 8, x), dist: lerp(9.5, 3.6, x), ty: lerp(1.6, 1.0, x), off: lerp(0, 1, x) };
        }
        const s = slotAt(t), tl = t - s.t0;
        const prev = prevSlot(s);
        const exName = s.kind === "rest" ? "rest" : s.ex;
        const c = camOf(exName);
        let end = { ...c, az: c.az, off: 1 };
        if (s.kind === "card") {
          // dramatic swing: high and wide, then settle into the first exercise's framing
          const x = Ez.inOut3(seg(tl, 0, CARD));
          const pc = prev ? camEnd(prev) : { az: 32, el: 8, dist: 3.6, ty: 1.0, off: 1 };
          const mid = { az: c.az + 60, el: 26, dist: 5.4, ty: 1.0, off: 1.25 };
          const k = Math.sin(x * Math.PI);
          return mixCam(mixCam(pc, end, x), mid, k * 0.7);
        }
        const drift = s.kind === "rest" ? tl * 4 : tl * 2.6;
        end = { ...c, az: c.az + drift, dist: c.dist - (s.kind === "rest" ? tl * 0.08 : tl * 0.05), off: 1 };
        if (prev && prev.kind !== "card") {
          const x = Ez.inOut3(seg(tl, 0, s.kind === "rest" ? 1.0 : 0.5));
          if (x < 1) return mixCam(camEnd(prev), end, x);
        }
        return end;
      }
      function camEnd(s) {
        const exName = s.kind === "rest" ? "rest" : s.ex;
        const c = camOf(exName);
        const tl = s.t1 - s.t0;
        if (s.kind === "card") return { ...c, off: 1 };
        const drift = s.kind === "rest" ? tl * 4 : tl * 2.6;
        return { ...c, az: c.az + drift, dist: c.dist - (s.kind === "rest" ? tl * 0.08 : tl * 0.05), off: 1 };
      }
      function mixCam(a, b, x) {
        let daz = b.az - a.az; while (daz > 180) daz -= 360; while (daz < -180) daz += 360;
        return { az: a.az + daz * x, el: lerp(a.el, b.el, x), dist: lerp(a.dist, b.dist, x), ty: lerp(a.ty, b.ty, x), off: lerp(a.off ?? 1, b.off ?? 1, x) };
      }

      // ================= RENDER =================
      const PROP_NAMES = () => Object.keys(props);
      function render(t) {
        const st = stateAt(t);
        const s = st.slot;
        // breathing / rest
        const restK = s && s.kind === "rest" ? Ez.inOut2(seg(t, T_REST, T_REST + 0.9)) * (1 - seg(t, T_REST_END - 0.1, T_REST_END)) : 0;
        const breathe = Math.sin(t * 2.2) * (0.4 + restK * 0.8);
        const out = applyPose(st.pose, t, breathe, restK * 0.5);

        // ----- muscles -----
        const cur = s ? EX[st.ex].mus : {};
        const prv = s && st.prevEx ? EX[st.prevEx].mus : {};
        const x = st.x ?? 1;
        const repK = s && s.kind === "ex" ? repR(st.tl) : 0;
        // reveal scan
        let scanY = -1;
        if (t < SLOTS[0].t0) {
          const sx = seg(t, 8.2, 10.4);
          scanY = lerp(0.0, 1.9, Ez.inOut2(sx));
          man.scan.visible = sx > 0 && sx < 1;
          man.scan.position.set(0, scanY, 0);
          man.scan.scale.setScalar(scanY > 1.45 ? 0.55 : scanY > 1.0 ? 0.9 : 0.75);
        } else man.scan.visible = false;
        const muscleY = { calf: 0.3, quad: 0.7, abs: 1.15, lat: 1.25, rhomb: 1.35, pec: 1.38, bi: 1.3, tri: 1.3, brach: 1.0, pecUp: 1.45, deltF: 1.47, deltS: 1.47, deltR: 1.47, trap: 1.52 };
        for (const id of MUSCLES) {
          let w = lerp(prv[id] || 0, cur[id] || 0, x);
          if (t < SLOTS[0].t0) {
            const passed = scanY >= muscleY[id] ? 1 : 0;
            const flash = seg(t, 10.7, 10.85) * (1 - seg(t, 11.4, 12.0));
            w = Math.max(passed * (1 - seg(t, 10.4, 11.0)) * 0.9, flash);
          }
          const glow = w * (0.65 + 0.35 * repK);
          mMat[id].color.set(P.muscle).lerp(C_ACC, Math.min(1, w * 1.1));
          mMat[id].emissive.copy(C_ACC).multiplyScalar(glow * 0.55);
        }

        // ----- props -----
        const want = new Set(s ? EX[st.ex].props : []);
        const had = new Set(s && st.prevEx ? EX[st.prevEx].props : []);
        const tl = st.tl ?? 0;
        for (const n of PROP_NAMES()) {
          let k = 0;
          if (want.has(n) && had.has(n)) k = 1;
          else if (want.has(n)) k = Ez.back(seg(tl, s && s.kind === "card" ? 0.4 : 0.12, (s && s.kind === "card" ? 0.4 : 0.12) + 0.38), 1.6);
          else if (had.has(n)) k = 1 - Ez.in2(seg(tl, 0, 0.22));
          props[n].visible = k > 0.01;
          props[n].userData.k = k;
        }
        const ky = (n) => Math.max(0.001, props[n].userData.k || 0);
        for (const n of ["flatBench", "flatBenchSide", "inclineBench", "seat", "backrest", "chestPad", "rowBench", "preacherPad", "towerFront", "towerLow", "towerHigh", "machineArms"]) {
          const g = props[n];
          if (!g.visible) continue;
          const k = ky(n);
          g.scale.set(1, k, 1);
          if (n === "flatBenchSide") g.position.set(0, 0, 0.0);
        }
        const [hL, hR] = out.hands;
        const mid = hL.clone().add(hR).multiplyScalar(0.5);
        const axis = hL.clone().sub(hR).normalize();
        const qAxis = new THREE.Quaternion().setFromUnitVectors(V3(1, 0, 0), axis);
        for (const n of ["bar", "ezbar", "rowBar", "latBar", "pushBar"]) {
          const g = props[n]; if (!g.visible) continue;
          g.position.copy(mid); g.quaternion.copy(qAxis); g.scale.setScalar(ky(n));
        }
        if (props.dbPair.visible) {
          const ex = EX[want.has("dbPair") ? st.ex : st.prevEx];
          const dirAx = ex && ex.db === "z" ? man.tor.localToWorld(V3(0, 0, 1)).sub(man.tor.localToWorld(V3(0, 0, 0))).normalize() : axis.clone();
          const q = new THREE.Quaternion().setFromUnitVectors(V3(1, 0, 0), dirAx);
          [props.dbPair.userData.L, props.dbPair.userData.R].forEach((d, i) => { d.position.copy(out.hands[i]); d.quaternion.copy(q); d.scale.setScalar(ky("dbPair")); });
        }
        if (props.dbSingle.visible) {
          const up = man.tor.localToWorld(V3(0, 1, 0)).sub(man.tor.localToWorld(V3(0, 0, 0))).normalize();
          const D = props.dbSingle.userData.D;
          D.position.copy(mid).addScaledVector(up, 0.06);
          D.quaternion.setFromUnitVectors(V3(0, 1, 0), up);
          D.scale.setScalar(ky("dbSingle"));
        }
        const exA = EX[st.ex] && EX[st.ex].anchor ? EX[st.ex] : EX[st.prevEx] && EX[st.prevEx].anchor ? EX[st.prevEx] : null;
        if (props.cable.visible && exA) {
          const A = man.root.localToWorld(V3(...exA.anchor));
          const attach = props.rope.visible ? mid.clone().add(A.clone().sub(mid).normalize().multiplyScalar(0.16)) : mid.clone();
          orientCyl(props.cable.userData.line, A, attach);
          props.cable.userData.line.visible = ky("cable") > 0.5;
          if (props.rope.visible) {
            const u = props.rope.userData;
            orientCyl(u.l, attach, hL); orientCyl(u.r, attach, hR);
            u.kl.position.copy(hL); u.kr.position.copy(hR);
          }
        }
        if (props.machineArms.visible) {
          props.machineArms.userData.arms.forEach((A2, i) => {
            const piv = man.root.localToWorld(V3(A2.s * 0.36, 1.5, -0.4));
            const hnd = out.hands[i];
            orientCyl(A2.a, piv, hnd);
            A2.hd.position.copy(hnd);
            A2.hd.quaternion.setFromUnitVectors(V3(0, 1, 0), V3(0, 1, 0));
          });
        }

        // ----- lights by moment -----
        const restDim = restK;
        const cardFlash = s && s.kind === "card" ? Math.sin(seg(t - s.t0, 0, CARD) * Math.PI) : 0;
        key.intensity = lerp(90, 30, restDim) + cardFlash * 60;
        key.color.setRGB(1, lerp(0.945, 0.85, restDim), lerp(0.88, 1, restDim));
        rimCool.intensity = 1.6 + restDim * 1.6;
        rimWarm.intensity = 1.1 * (1 - restDim * 0.7);
        hemi.intensity = 0.55 - restDim * 0.2;
        const introK = Ez.inOut2(seg(t, T_REVEAL - 0.4, 8.6));
        coneMats[0].opacity = (0.035 + cardFlash * 0.05) * (1 - restDim * 0.6) * introK;
        coneMats[1].opacity = (0.9 + cardFlash * 0.4) * (1 - restDim * 0.5) * introK;
        lightStrips.forEach((m, i) => {
          const wave = s && s.kind === "card" ? clamp01(1 - Math.abs(seg(t - s.t0, 0, CARD) * 6 - (i % 5) * 1.2)) : 0;
          m.material.color.setRGB(lerp(0.95, 0.5, restDim) + wave * 0.05, lerp(0.96, 0.62, restDim), 1);
        });

        // ----- camera -----
        let c = camFor(t);
        // outro push into the chest
        const push = Ez.in3(seg(t, T_OUT - 0.55, T_OUT));
        const tgt = man.root.localToWorld(V3(0, c.ty, 0));
        const az = c.az * DEG, el = c.el * DEG;
        const dist = c.dist * (1 - push * 0.75);
        camera.position.set(tgt.x + dist * Math.sin(az) * Math.cos(el), tgt.y + dist * Math.sin(el), tgt.z + dist * Math.cos(az) * Math.cos(el));
        camera.lookAt(tgt);
        // shift the subject right of centre to leave room for the type panel
        const off = c.off ?? 1;
        camera.setViewOffset(W, H, -Math.round(300 * off), 0, W, H);
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
      }

      // ================= BUILD =================
      try { await document.fonts.load("700 120px Oswald"); } catch (e) {}
      await buildGym();
      buildMan();
      buildProps();
      host.render = render;
      render(host.clock.t);
      host.ready();
    </script>
  </body>
</html>
